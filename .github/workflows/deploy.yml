name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Atomic Deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      APP_ROOT: ${{ vars.APP_ROOT }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      KEEP_RELEASES: "2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
          VITE_EMAILJS_APPOINTMENT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_APPOINTMENT_TEMPLATE_ID }}
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Validate required deployment variables
        run: |
          test -n "${APP_ROOT}" || (echo "APP_ROOT variable is required" && exit 1)
          test -n "${SSH_HOST}" || (echo "SSH_HOST variable is required" && exit 1)
          test -n "${SSH_PORT}" || (echo "SSH_PORT variable is required" && exit 1)
          test -n "${SSH_USER}" || (echo "SSH_USER variable is required" && exit 1)

      - name: Prepare release metadata
        id: release
        run: |
          ts="$(date -u +'%Y%m%d%H%M%S')"
          short_sha="${GITHUB_SHA::8}"
          release_id="${ts}-${short_sha}"
          release_path="${APP_ROOT}/releases/${release_id}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_path=$release_path" >> "$GITHUB_OUTPUT"

      - name: Create server directories
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${APP_ROOT}/releases' '${APP_ROOT}/shared/logs' '${APP_ROOT}/shared/tmp'"

      - name: Upload deployment scripts
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            scripts/deploy/ \
            "${SSH_USER}@${SSH_HOST}:${APP_ROOT}/shared/tmp/deploy-scripts/"

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "chmod +x '${APP_ROOT}/shared/tmp/deploy-scripts/'*.sh"

      - name: Upload release to non-live directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${{ steps.release.outputs.release_path }}'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            dist/ \
            "${SSH_USER}@${SSH_HOST}:${{ steps.release.outputs.release_path }}/"

      - name: Validate release and atomic deploy switch
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "${APP_ROOT}/shared/tmp/deploy-scripts/release_deploy.sh --app-root '${APP_ROOT}' --release-id '${{ steps.release.outputs.release_id }}' --keep '${KEEP_RELEASES}'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
