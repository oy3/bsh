# Production Nginx config for BSH Vue SPA
# Copy to /etc/nginx/sites-available/bsh.conf and symlink into sites-enabled.
# Update server_name and certificate paths before enabling.

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name basespecialistshospital.com www.basespecialistshospital.com basespecialisthospital.com www.basespecialisthospital.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name basespecialistshospital.com www.basespecialistshospital.com;

    # Certbot-managed certificate paths
    ssl_certificate /etc/letsencrypt/live/basespecialistshospital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/basespecialistshospital.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Current active release symlink
    root /apps/bsh/current;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Never cache index.html so deployments are visible immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri =404;
    }

    # Aggressive cache for hashed static assets generated by Vite
    location ~* \.(?:js|mjs|css|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide dotfiles
    location ~ /\. {
        deny all;
    }

    # Logs
    access_log /apps/bsh/shared/logs/nginx-access.log;
    error_log /apps/bsh/shared/logs/nginx-error.log warn;
}
